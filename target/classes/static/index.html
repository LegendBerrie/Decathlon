<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decathlon Web MVP</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
        .row { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; flex-wrap: wrap; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: .5rem; text-align: left; white-space: nowrap; }
        #error { color: #b00020; }
        .table-wrap { overflow-x: auto; }
        .mode-group { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    </style>
</head>
<body>
<h1>Track and Field Web MVP</h1>

<div class="card">
    <div class="mode-group">
        <label><input type="radio" name="mode" value="deca" checked> Decathlon</label>
        <label><input type="radio" name="mode" value="hep"> Heptathlon</label>
    </div>
</div>

<div class="card">
    <h2>Add competitor</h2>
    <div class="row">
        <label for="name">Name</label>
        <input id="name" data-testid="competitorNameInput" placeholder="e.g., Anna Andersson" />
        <button id="add" data-testid="addCompetitorBtn">Add competitor</button>
    </div>
    <div id="error" data-testid="errorBanner" aria-live="polite"></div>
</div>

<div class="card">
    <h2>Enter result</h2>
    <div class="row">
        <label for="name2">Name</label>
        <input id="name2" placeholder="same as above" />
        <label for="event">Event</label>
        <select id="event" data-testid="eventSelect"></select>
        <label for="raw">Result</label>
        <input id="raw" data-testid="rawInput" type="number" step="0.01" />
        <button id="save" data-testid="saveScoreBtn">Calculate score</button>
    </div>
    <div id="msg" aria-live="polite"></div>
</div>

<div class="card">
    <h2>Standings</h2>
    <div class="table-wrap">
        <table>
            <thead>
            <tr id="standingsHead"></tr>
            </thead>
            <tbody id="standings" data-testid="standingsTable"></tbody>
        </table>
    </div>
    <button id="export" data-testid="exportCsvBtn">Export CSV</button>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
